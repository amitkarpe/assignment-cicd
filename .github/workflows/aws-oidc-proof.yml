name: AWS OIDC proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-assignment-cicd-chatgpt-lab
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create, read, and clean up proof parameter
        shell: bash
        run: |
          set -euo pipefail
          NAME="/chatgpt-aws-lab/github-oidc-proof-${GITHUB_RUN_ID}"
          trap 'aws ssm delete-parameter --name "$NAME" >/dev/null 2>&1 || true' EXIT
          aws ssm put-parameter \
            --name "$NAME" \
            --type String \
            --value "github-oidc-proof-${GITHUB_RUN_ID}" \
            --description "Temporary GitHub Actions OIDC proof" \
            --tags Key=project,Value=chatgpt-aws-lab Key=purpose,Value=github-oidc-proof Key=owner,Value=amit
          aws ssm get-parameter --name "$NAME" --query 'Parameter.Name' --output text
          aws ssm delete-parameter --name "$NAME"
          trap - EXIT

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          NAME="/chatgpt-aws-lab/github-oidc-proof-${GITHUB_RUN_ID}"
          if aws ssm get-parameter --name "$NAME" >/dev/null 2>&1; then
            echo "Proof parameter still exists"
            exit 1
          fi
          echo "Cleanup verified"
